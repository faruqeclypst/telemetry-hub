services:
  telemetry-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - telemetry-data:/app/data

volumes:
  telemetry-data:
